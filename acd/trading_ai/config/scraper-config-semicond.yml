# Number of symbols downloaded concurrently. Keep this conservative for IB pacing.
max_workers: 10

# Relative paths are resolved beneath BASE_DIR.
output_root: data
defaults:
  duration: "3 Y"
  bar_size: " 1 hour"
  sessions:
    # - rth
    - extended
    # - overnight
  what_to_show: TRADES
  currency: USD
groups:
  semiconductor:
    symbols:
      - NVDA
      - AMD
      - AVGO
      - TSM
      - MRVL
      - AMAT
      - INTC      
      - MU

      # # A symbol may override any default:
      # - symbol: INTC
      #   primary_exchange: NASDAQ   
  context:
    symbols:
      - symbol: SMH
        duration: "3 Y"
      - symbol: SPY
        duration: "3 Y"
